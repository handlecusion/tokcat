name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Vite build
        run: npm run build

  rust:
    name: Rust check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  native:
    name: Swift build + test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: native/LocalPackage/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('native/LocalPackage/Package.resolved') }}

      - name: swift build
        working-directory: native/LocalPackage
        run: swift build

      - name: swift test
        working-directory: native/LocalPackage
        run: swift test

      - name: xcodegen + app build
        run: |
          brew install xcodegen
          cd native
          xcodegen generate
          xcodebuild -project Tokcat.xcodeproj -scheme Tokcat \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build-ci \
            CODE_SIGN_IDENTITY="-" build | tail -5
          # Lowercase executable is a hard requirement (old-updater relaunch).
          test -f build-ci/Build/Products/Debug/Tokcat.app/Contents/MacOS/tokcat \
            || { echo "tokcat executable missing from bundle"; exit 1; }
